# A warning reads in owner words, and "Why this part?" shows the evidence.
# Aditi's Thar Roxx is the demo's brake-pads case: "Soon". Whether it is booked depends on
# whether book-and-cancel has run, so the booking card is not asserted here.
appId: io.autosaarthi.owner
name: Home with a warning
---
- runFlow:
    file: common/sign-in.yaml
    env:
      EMAIL: aditi.nair@example.in
- extendedWaitUntil:
    visible: "Thar Roxx"
    timeout: 30000
- assertVisible: "Soon.*"
- assertVisible: "Your brake pads are wearing out"
- assertNotVisible: "P2"
# The button sits under the cost figures, below the first screen.
- scrollUntilVisible:
    element: "Why this part?"
    direction: DOWN
- tapOn: "Why this part?"
- extendedWaitUntil:
    visible: "Why we think so"
    timeout: 15000
- back
# Home keeps its scroll position, so the car's name may be off screen; the warning is not.
- assertVisible: "Your brake pads are wearing out"
